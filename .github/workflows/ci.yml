# Required check for every pull request into main (and for main itself after a merge).
# Builds and tests everything, packages the app and runs the security baseline audit.
# Pure Swift: no Node or web UI to set up.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test
        run: make check

      - name: Package and audit (scripts/verify-app.sh)
        run: make app

      - name: Self-test the packaged app
        run: perl -e 'alarm 120; exec @ARGV' build/ArcClone.app/Contents/MacOS/ArcClone --self-test
