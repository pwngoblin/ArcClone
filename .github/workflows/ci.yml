# Required check for every pull request into main (and for main itself after a merge).
# Builds and tests everything, packages the app and runs the security baseline audit.
# Pure Swift: no Node or web UI to set up.
name: CI

on:
  pull_request:
    branches: [main]
    # "edited" fires when GitHub retargets a stacked PR onto main after its base merges;
    # without it the required check never starts on the retargeted PR.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false # no token left in .git/config for later steps

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test
        run: make check

      - name: Package and audit (scripts/verify-app.sh)
        run: make app

      - name: Self-test the packaged app
        run: perl -e 'alarm 120; exec @ARGV' build/ArcClone.app/Contents/MacOS/ArcClone --self-test
