name: Feature request
description: Suggest something Lily should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The workflow or problem, not only the solution. "When I … I want to …"
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Lily to do?
  - type: textarea
    id: elsewhere
    attributes:
      label: How do other browsers handle it?
      description: Arc, Safari, Chrome, Zen… Screenshots welcome.
